<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="primaryBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1000" height="450" rx="16" fill="url(#bgGrad)" />
  <path d="M 0,340 C 300,280 600,380 1000,310 L 1000,450 L 0,450 Z" fill="#ffffff" opacity="0.5" />
  <path d="M 0,370 C 400,310 700,410 1000,350 L 1000,450 L 0,450 Z" fill="#38bdf8" opacity="0.3" />

  <!-- Símbolo Mãos e Coração -->
  <g transform="translate(180, 210)">
    <path d="M -85,-35 A 110 110 0 1 1 85,35" fill="none" stroke="url(#primaryBlue)" stroke-width="12" stroke-linecap="round" />
    <path d="M 0,-25 C -30,-60 -75,-30 -40,15 C -20,40 0,60 0,60 C 0,60 20,40 40,15 C 75,-30 30,-60 0,-25 Z" fill="url(#heartGrad)" opacity="0.85" />
    <path d="M -65,35 C -45,5 -15,15 0,45 C -25,40 -45,50 -65,35 Z" fill="url(#primaryBlue)" />
    <path d="M 65,35 C 45,5 15,15 0,45 C 25,40 45,50 65,35 Z" fill="url(#primaryBlue)" />
  </g>

  <!-- Textos -->
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="340" y="210" font-size="50" font-weight="900" fill="#0c4a6e" letter-spacing="1">NOSSA MISSÃO</text>
    <text x="340" y="255" font-size="22" font-weight="500" fill="#0284c7" letter-spacing="0.5">Semeando o Amanhã, Cuidando de Vidas</text>
  </g>

  <!-- Ícones Ilustrativos (Família e Educação) -->
  <g transform="translate(760, 210)" fill="#0284c7">
    <!-- Círculo de Proteção -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.6" />
    <!-- Livro Aberto -->
    <path d="M -35,20 C -15,10 0,20 0,20 C 0,20 15,10 35,20 L 35,45 C 15,35 0,45 0,45 C 0,45 -15,35 -35,45 Z" fill="none" stroke="#0284c7" stroke-width="5" />
    <!-- Capelo / Graduação -->
    <path d="M 0,-45 L 35,-30 L 0,-15 L -35,-30 Z" />
    <path d="M 20,-22 L 20,0 C 20,10 -20,10 -20,0 L -20,-22" fill="none" stroke="#0284c7" stroke-width="4" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Azul -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    
    <linearGradient id="primaryBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="heartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="1000" height="450" rx="16" fill="url(#bgGrad)" />

  <!-- Ondas decorativas de fundo -->
  <path d="M 0,340 C 300,280 600,380 1000,310 L 1000,450 L 0,450 Z" fill="#ffffff" opacity="0.5" />
  <path d="M 0,370 C 400,310 700,410 1000,350 L 1000,450 L 0,450 Z" fill="#38bdf8" opacity="0.3" />

  <!-- SÍMBOLO DO LOGOTIPO (Mãos e Coração) -->
  <g transform="translate(180, 210)">
    <!-- Arco Circular externo -->
    <path d="M -85,-35 A 110 110 0 1 1 85,35" fill="none" stroke="url(#primaryBlue)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Coração central -->
    <path d="M 0,-25 C -30,-60 -75,-30 -40,15 C -20,40 0,60 0,60 C 0,60 20,40 40,15 C 75,-30 30,-60 0,-25 Z" fill="url(#heartGrad)" opacity="0.85" />

    <!-- Mãos sustentando o coração -->
    <path d="M -65,35 C -45,5 -15,15 0,45 C -25,40 -45,50 -65,35 Z" fill="url(#primaryBlue)" />
    <path d="M 65,35 C 45,5 15,15 0,45 C 25,40 45,50 65,35 Z" fill="url(#primaryBlue)" />
  </g>

  <!-- TEXTOS INSTITUCIONAIS -->
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
    <!-- ONG -->
    <text x="340" y="160" font-size="36" font-weight="700" fill="#0369a1" letter-spacing="3">ONG</text>
    
    <!-- ESPERANÇA VIVA -->
    <text x="340" y="220" font-size="52" font-weight="900" fill="#0c4a6e" letter-spacing="1">ESPERANÇA VIVA</text>
    
    <!-- Slogan -->
    <text x="340" y="260" font-size="22" font-weight="500" fill="#0284c7" letter-spacing="0.5">Semeando o Amanhã, Cuidando de Vidas</text>
  </g>

  <!-- SILHUETA ILUSTRATIVA (Voluntários e Comunidade) -->
  <g transform="translate(720, 220)" fill="#0284c7" opacity="0.6">
    <!-- Voluntário 1 -->
    <circle cx="-80" cy="-45" r="16" />
    <path d="M -100,5 C -100,-25 -60,-25 -60,5 L -60,75 L -100,75 Z" />
    
    <!-- Voluntário 2 -->
    <circle cx="10" cy="-55" r="18" />
    <path d="M -10,-5 C -10,-35 30,-35 30,-5 L 30,85 L -10,85 Z" />
    
    <!-- Criança / Atendida -->
    <circle cx="-35" cy="10" r="12" fill="#38bdf8" />
    <path d="M -50,40 C -50,20 -20,20 -20,40 L -20,85 L -50,85 Z" fill="#38bdf8" />
  </g>
</svg>
